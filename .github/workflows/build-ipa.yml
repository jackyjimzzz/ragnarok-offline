name: Build RagOff iPad Mod (unsigned IPA)

# Run manually from the GitHub "Actions" tab.
on:
  workflow_dispatch:

jobs:
  build:
    # Needs Xcode 26 (the project uses an Icon Composer .icon file).
    # The "Select newest Xcode" step below picks the newest Xcode on the runner.
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout (with swift-rathena submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; fi
          xcodebuild -version

      - name: Build archive (no code signing)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project RagnarokOffline.xcodeproj \
            -scheme RagnarokOffline \
            -configuration Release \
            -xcconfig Configurations/AppStore.xcconfig \
            -destination "generic/platform=iOS" \
            -archivePath build/RagOff.xcarchive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/RagOff.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -qry RagOff-iPad-Mod.ipa Payload
          ls -lh RagOff-iPad-Mod.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RagOff-iPad-Mod-ipa
          path: build/RagOff-iPad-Mod.ipa
