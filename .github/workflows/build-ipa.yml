name: Build RagOff iPad Mod (unsigned IPA)

# Run manually from the GitHub "Actions" tab.
on:
  workflow_dispatch:

jobs:
  build:
    # Needs a macOS runner with Xcode 26 (the project uses an Icon Composer .icon file).
    # If this label is unavailable, change it to macos-latest or macos-15.
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout (with swift-rathena submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build archive (no code signing)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project RagnarokOffline.xcodeproj \
            -scheme RagnarokOffline \
            -configuration Release \
            -xcconfig Configurations/AppStore.xcconfig \
            -destination "generic/platform=iOS" \
            -archivePath build/RagOff.xcarchive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/RagOff.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -qry RagOff-iPad-Mod.ipa Payload
          ls -lh RagOff-iPad-Mod.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RagOff-iPad-Mod-ipa
          path: build/RagOff-iPad-Mod.ipa
